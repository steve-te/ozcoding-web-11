name: Deploy to EC2 via CodeDeploy

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via CodeDeploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Zip source files
        run: zip -r deploy.zip . -x '*.git*'

      - name: Upload to S3
        run: |
          aws s3 cp deploy.zip s3://deploy-resource-01/deploy.zip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_DEPLOY_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_DEPLOY_ACCESS_SECRET }}
          # AWS_REGION: ap-northeast-2

      - name: Trigger CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name flask-deploy-app \
            --deployment-group-name flask-deploy-group \
            --s3-location bucket=deploy-resource-01,bundleType=zip,key=deploy.zip \
            --file-exists-behavior OVERWRITE
            --region ap-northeast-2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_DEPLOY_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_DEPLOY_ACCESS_SECRET }}
          AWS_REGION: ap-northeast-2
